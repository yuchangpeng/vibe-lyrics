<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 2560px; height: 1664px; overflow: hidden;
    background: #F5F5F7;
    font-family: -apple-system, "SF Pro Display", "SF Pro SC", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .kicker {
    font-size: 54px; font-weight: 500;
    color: #86868B; letter-spacing: 0.06em;
  }
  h1 {
    margin-top: 36px;
    font-size: 128px; font-weight: 700;
    color: #1D1D1F; letter-spacing: -0.015em;
  }

  .demo {
    margin-top: 100px;
    width: 1560px; height: 380px;
    border-radius: 32px;
    background: linear-gradient(135deg, #0D1017 0%, #161E2C 52%, #0F141C 100%);
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.14);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .lyric {
    font-family: ui-rounded, -apple-system, "PingFang SC", sans-serif;
    font-size: 74px; font-weight: 700;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .sung { color: rgba(255, 255, 255, 0.96); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35); }
  .active {
    color: #FFFFFF;
    display: inline-block; transform: translateY(-6px);
    text-shadow: 0 0 30px rgba(255, 255, 255, 0.95), 0 0 60px rgba(255, 255, 255, 0.4), 0 2px 10px rgba(0, 0, 0, 0.3);
  }
  .fog { color: rgba(255, 255, 255, 0.5); filter: blur(2.6px); }
  .preview {
    margin-top: 38px;
    font-family: ui-rounded, -apple-system, "PingFang SC", sans-serif;
    font-size: 28px; font-weight: 600;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.04em;
  }

  .footer {
    margin-top: 110px;
    display: flex; flex-direction: column; align-items: center;
  }
  .wordmark {
    font-size: 42px; font-weight: 600;
    color: #1D1D1F; letter-spacing: 0.01em;
  }
  .sub {
    margin-top: 18px;
    font-size: 24px; font-weight: 400;
    color: #86868B; letter-spacing: 0.05em;
  }
  .byline {
    margin-top: 14px;
    font-size: 22px; font-weight: 400;
    color: #A1A1A6; letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="kicker">什么？</div>
    <h1>Apple Music 也有桌面歌词啦？</h1>

    <div class="demo">
      <div class="lyric"><span class="sung">歌词浮在桌面上&ensp;</span><span class="active">跟</span><span class="fog">着旋律呼吸</span></div>
      <div class="preview">让每个字都落在节拍上</div>
    </div>

    <div class="footer">
      <div class="wordmark">♪&ensp;Vibe Lyrics</div>
      <div class="sub">Desktop lyrics for Apple Music</div>
      <div class="byline">Designed by chendiqin · 2026</div>
    </div>
  </div>
</body>
</html>
