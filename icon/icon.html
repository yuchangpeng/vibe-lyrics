<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  /* macOS 规格：1024 画布，824 圆角方块居中 */
  .squircle {
    position: absolute; left: 100px; top: 100px;
    width: 824px; height: 824px;
    border-radius: 186px;
    background: linear-gradient(135deg, #131924 0%, #1F2A40 52%, #10151F 100%);
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  /* 左上入光 */
  .light {
    position: absolute; left: -20%; top: -30%;
    width: 100%; height: 90%;
    background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, transparent 65%);
  }
  .note {
    position: absolute; left: 0; top: 68px;
    width: 100%; text-align: center;
    font-family: ui-rounded, -apple-system, sans-serif;
    font-size: 560px; font-weight: 700;
    color: rgba(255, 255, 255, 0.97);
    text-shadow: 0 0 90px rgba(255, 255, 255, 0.4), 0 0 34px rgba(255, 255, 255, 0.3), 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  /* 闪粉 */
  .p { position: absolute; border-radius: 50%; background: #fff; }
  .p1 { width: 22px; height: 22px; left: 596px; top: 236px; opacity: 0.95; box-shadow: 0 0 26px rgba(255,255,255,0.9); }
  .p2 { width: 13px; height: 13px; left: 650px; top: 300px; opacity: 0.7; box-shadow: 0 0 16px rgba(255,255,255,0.7); }
  .p3 { width: 9px;  height: 9px;  left: 566px; top: 320px; opacity: 0.5; }
  .p4 { width: 15px; height: 15px; left: 634px; top: 196px; opacity: 0.55; filter: blur(1px); }
  .p5 { width: 7px;  height: 7px;  left: 690px; top: 250px; opacity: 0.4; filter: blur(1px); }
</style>
</head>
<body>
  <div class="squircle">
    <div class="light"></div>
    <div class="note">♪</div>
    <div class="p p1"></div><div class="p p2"></div><div class="p p3"></div><div class="p p4"></div><div class="p p5"></div>
  </div>
</body>
</html>
